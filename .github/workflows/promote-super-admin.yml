name: Promote Super Admin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-super-admin
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Promote the configured existing admin
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" || -z "$SUPER_ADMIN_EMAIL" ]]; then
            echo "::error::Add DATABASE_URL and SUPER_ADMIN_EMAIL under repository Actions secrets."
            exit 1
          fi
          npm run promote-super-admin
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
