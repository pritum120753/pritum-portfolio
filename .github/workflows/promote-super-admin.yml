name: Promote Super Admin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-super-admin
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Promote the configured existing admin
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" || -z "$SUPER_ADMIN_EMAIL" ]]; then
            echo "::error::Add DATABASE_URL and SUPER_ADMIN_EMAIL under repository Actions secrets."
            exit 1
          fi
          npm run promote-super-admin
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
